name: AGROLSKLEP - Publish OpenAI catalog via HTTPS

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC = 20:00 (Polish summer time), 19:00 (Polish winter time).
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: agrolsklep-pages
  cancel-in-progress: false

jobs:
  prepare-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout generator code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate normalization rules
        run: python -m unittest discover -s tests -v

      - name: Download, normalize and validate CTX Feed
        run: python scripts/build_openai_feed.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publish-pages:
    needs: prepare-feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
